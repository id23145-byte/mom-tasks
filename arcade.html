<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Offline Games Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
    body { background-color: #121214; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    #arcade-container { position: relative; width: 100%; max-width: 420px; height: 90vh; max-height: 750px; background: #1a1a24; border-radius: 24px; box-shadow: 0 12px 35px rgba(0,0,0,0.6); overflow: hidden; border: 4px solid #2e2e3e; display: flex; flex-direction: column; }
    
    .header { padding: 15px; background: #252533; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #3a3a4d; z-index: 10; }
    .header h2 { font-size: 1.2rem; color: #ff007f; letter-spacing: 0.5px; }
    .back-btn { background: #ff477e; color: white; border: none; padding: 6px 14px; border-radius: 16px; font-weight: bold; cursor: pointer; display: none; }

    .screen { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: flex-start; padding: 15px; position: relative; overflow-y: auto; }
    .screen.active { display: flex; }

    /* CELEBRATION OVERLAY */
    #celebration-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 100;
      animation: popIn 0.3s ease-out;
    }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .celeb-emoji { font-size: 5rem; animation: bounce 0.6s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
    .celeb-text { font-size: 2rem; font-weight: bold; color: #00f5d4; text-shadow: 0 0 10px #00f5d4; margin: 15px 0; text-align: center; }

    /* MENU GRID */
    .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; padding-bottom: 10px; }
    .game-card { background: #252533; border: 2px solid #3a3a4d; border-radius: 18px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.15s; }
    .game-card:active { transform: scale(0.95); border-color: #ff007f; }
    .game-icon { font-size: 2.5rem; margin-bottom: 6px; }
    .game-title { font-size: 0.85rem; font-weight: bold; text-align: center; }

    canvas { background: #000; border-radius: 12px; }

    /* SNAKE CONTROLS */
    .arrow-pad { display: grid; grid-template-columns: repeat(3, 50px); gap: 5px; margin-top: 10px; }
    .arrow-btn { background: #252533; border: 2px solid #3a3a4d; color: white; font-size: 1.2rem; border-radius: 10px; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .arrow-btn:active { background: #ff007f; }

    /* DRESS UP & MAKEUP */
    .salon-display { position: relative; width: 180px; height: 200px; background: #2d2d3f; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; border: 3px solid #ff007f; }
    .character-avatar { font-size: 6rem; position: relative; display: flex; align-items: center; justify-content: center; }
    .layer-hat { position: absolute; top: -22px; font-size: 3.5rem; pointer-events: none; }
    .layer-eyeshadow { position: absolute; top: 18px; width: 50px; height: 12px; border-radius: 10px; opacity: 0.6; pointer-events: none; }
    .layer-blush { position: absolute; top: 38px; width: 70px; height: 12px; display: flex; justify-content: space-between; pointer-events: none; }
    .blush-dot { width: 14px; height: 14px; border-radius: 50%; opacity: 0.5; }
    .layer-lipstick { position: absolute; top: 54px; width: 22px; height: 8px; border-radius: 4px; opacity: 0.8; pointer-events: none; }
    .layer-outfit { position: absolute; bottom: -20px; font-size: 3.5rem; pointer-events: none; }

    .tab-bar { display: flex; gap: 6px; margin-bottom: 10px; width: 100%; justify-content: center; }
    .tab-btn { background: #252533; color: white; border: 1px solid #3a3a4d; padding: 6px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: #ff007f; border-color: #ff007f; }

    .palette-box { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; background: #252533; padding: 12px; border-radius: 16px; width: 100%; }
    .color-swatch { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
    .emoji-item { font-size: 2rem; cursor: pointer; padding: 4px; background: #333344; border-radius: 10px; }

    /* TIC TAC TOE */
    .ttt-grid { display: grid; grid-template-columns: repeat(3, 75px); grid-template-rows: repeat(3, 75px); gap: 8px; margin-top: 15px; }
    .ttt-cell { background: #252533; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; cursor: pointer; border: 2px solid #3a3a4d; }

    /* PREDICTION */
    .prediction-box { width: 220px; height: 110px; background: #ff007f; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold; text-align: center; padding: 15px; margin: 20px 0; box-shadow: 0 8px 20px rgba(255, 0, 127, 0.4); }
    .spin-btn { background: #00f5d4; color: #000; border: none; padding: 10px 20px; font-size: 1rem; font-weight: bold; border-radius: 25px; cursor: pointer; }

    /* NUTS & BOLTS */
    .board { display: flex; gap: 15px; margin-top: 20px; }
    .bolt { width: 55px; height: 160px; background: #3a3a4c; border-radius: 12px; display: flex; flex-direction: column-reverse; align-items: center; padding: 8px; gap: 6px; cursor: pointer; border: 2px solid #555; }
    .bolt.selected { border-color: #00f5d4; }
    .nut { width: 40px; height: 22px; border-radius: 6px; }

    /* BLOCK BLAST */
    .grid-8x8 { display: grid; grid-template-columns: repeat(8, 28px); grid-template-rows: repeat(8, 28px); gap: 3px; background: #111; padding: 6px; border-radius: 8px; margin-top: 15px; }
    .cell { width: 28px; height: 28px; background: #222; border-radius: 4px; }
    .cell.filled { background: #7b2cbf; }
  </style>
</head>
<body>

  <div id="arcade-container">
    <!-- Header -->
    <div class="header">
      <h2 id="app-title">🎮 Offline Games</h2>
      <button class="back-btn" id="back-btn" onclick="openMenu()">Menu 🏠</button>
    </div>

    <!-- CELEBRATION OVERLAY -->
    <div id="celebration-overlay">
      <div class="celeb-emoji">🎉🏆🎉</div>
      <div class="celeb-text" id="celeb-msg">YOU WIN!</div>
      <button class="spin-btn" onclick="closeCelebration()">Play Again 🚀</button>
    </div>

    <!-- MAIN MENU -->
    <div id="menu-screen" class="screen active">
      <div class="game-grid">
        <div class="game-card" onclick="launchGame('dressup')">
          <div class="game-icon">💄</div>
          <div class="game-title">Dress Up & Makeup</div>
        </div>
        <div class="game-card" onclick="launchGame('ttt')">
          <div class="game-icon">❌</div>
          <div class="game-title">Tic-Tac-Toe</div>
        </div>
        <div class="game-card" onclick="launchGame('flappy')">
          <div class="game-icon">🐤</div>
          <div class="game-title">Flappy Jump</div>
        </div>
        <div class="game-card" onclick="launchGame('colorball')">
          <div class="game-icon">🟡</div>
          <div class="game-title">Color Ball Switch</div>
        </div>
        <div class="game-card" onclick="launchGame('snake')">
          <div class="game-icon">🐍</div>
          <div class="game-title">Snake Classic</div>
        </div>
        <div class="game-card" onclick="launchGame('predict')">
          <div class="game-icon">🔮</div>
          <div class="game-title">Prediction Filter</div>
        </div>
        <div class="game-card" onclick="launchGame('nuts')">
          <div class="game-icon">🔩</div>
          <div class="game-title">Nuts & Bolts</div>
        </div>
        <div class="game-card" onclick="launchGame('blocks')">
          <div class="game-icon">🧱</div>
          <div class="game-title">Block Blast Grid</div>
        </div>
      </div>
    </div>

    <!-- 1. DRESS UP & MAKEUP -->
    <div id="dressup-screen" class="screen">
      <div class="salon-display">
        <div class="character-avatar">
          👧
          <div class="layer-hat" id="layer-hat"></div>
          <div class="layer-eyeshadow" id="layer-eyeshadow"></div>
          <div class="layer-blush">
            <div class="blush-dot" id="blush-left"></div>
            <div class="blush-dot" id="blush-right"></div>
          </div>
          <div class="layer-lipstick" id="layer-lipstick"></div>
          <div class="layer-outfit" id="layer-outfit"></div>
        </div>
      </div>

      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchSalonTab('makeup')">💄 Makeup</button>
        <button class="tab-btn" onclick="switchSalonTab('clothes')">👗 Clothes</button>
        <button class="tab-btn" onclick="switchSalonTab('hats')">👑 Hats</button>
      </div>

      <div class="palette-box" id="palette-makeup">
        <p style="width: 100%; font-size: 0.8rem; text-align: center; color: #aaa;">Lipstick</p>
        <div class="color-swatch" style="background: #ff0055;" onclick="setMakeup('lipstick', '#ff0055')"></div>
        <div class="color-swatch" style="background: #cc0000;" onclick="setMakeup('lipstick', '#cc0000')"></div>
        <div class="color-swatch" style="background: #ff66a3;" onclick="setMakeup('lipstick', '#ff66a3')"></div>
        <p style="width: 100%; font-size: 0.8rem; text-align: center; color: #aaa; margin-top: 6px;">Eyeshadow</p>
        <div class="color-swatch" style="background: #00d2ff;" onclick="setMakeup('eyeshadow', '#00d2ff')"></div>
        <div class="color-swatch" style="background: #9d4edd;" onclick="setMakeup('eyeshadow', '#9d4edd')"></div>
        <div class="color-swatch" style="background: #ffb703;" onclick="setMakeup('eyeshadow', '#ffb703')"></div>
      </div>

      <div class="palette-box" id="palette-clothes" style="display: none;">
        <span class="emoji-item" onclick="setClothes('👗')">👗</span>
        <span class="emoji-item" onclick="setClothes('👕')">👕</span>
        <span class="emoji-item" onclick="setClothes('👘')">👘</span>
        <span class="emoji-item" onclick="setClothes('🥻')">🥻</span>
      </div>

      <div class="palette-box" id="palette-hats" style="display: none;">
        <span class="emoji-item" onclick="setHat('👑')">👑</span>
        <span class="emoji-item" onclick="setHat('🧢')">🧢</span>
        <span class="emoji-item" onclick="setHat('🎀')">🎀</span>
        <span class="emoji-item" onclick="setHat('🎩')">🎩</span>
      </div>
      <button class="spin-btn" style="margin-top: 15px;" onclick="triggerCelebration('STUNNING LOOK!')">Done 📸</button>
    </div>

    <!-- 2. TIC TAC TOE -->
    <div id="ttt-screen" class="screen">
      <div class="ttt-grid" id="ttt-board"></div>
      <p id="ttt-status" style="margin-top: 15px; font-weight: bold;">Your Turn (X)</p>
      <button class="spin-btn" style="margin-top: 10px;" onclick="resetTTT()">Restart</button>
    </div>

    <!-- 3. FLAPPY JUMP -->
    <div id="flappy-screen" class="screen">
      <canvas id="flappyCanvas" width="280" height="320"></canvas>
      <p style="margin-top: 10px; font-size: 0.85rem; color: #aaa;">Tap screen to Flap!</p>
    </div>

    <!-- 4. COLOR BALL -->
    <div id="color-screen" class="screen">
      <canvas id="colorCanvas" width="280" height="320"></canvas>
      <p style="margin-top: 10px; font-size: 0.85rem; color: #aaa;">Tap screen to switch color!</p>
    </div>

    <!-- 5. SNAKE -->
    <div id="snake-screen" class="screen">
      <canvas id="snakeCanvas" width="280" height="240"></canvas>
      <div class="arrow-pad">
        <div></div><div class="arrow-btn" onclick="setSnakeDir(0,-1)">⬆️</div><div></div>
        <div class="arrow-btn" onclick="setSnakeDir(-1,0)">⬅️</div><div></div><div class="arrow-btn" onclick="setSnakeDir(1,0)">➡️</div>
        <div></div><div class="arrow-btn" onclick="setSnakeDir(0,1)">⬇️</div><div></div>
      </div>
    </div>

    <!-- 6. PREDICTION -->
    <div id="predict-screen" class="screen">
      <div class="prediction-box" id="prediction-text">Tap Spin!</div>
      <button class="spin-btn" onclick="spinPrediction()">🔮 Predict My Day</button>
    </div>

    <!-- 7. NUTS & BOLTS -->
    <div id="nuts-screen" class="screen">
      <div class="board">
        <div class="bolt" id="b1" onclick="handleBoltClick(1)">
          <div class="nut" style="background: #ff477e;"></div>
          <div class="nut" style="background: #00f5d4;"></div>
        </div>
        <div class="bolt" id="b2" onclick="handleBoltClick(2)">
          <div class="nut" style="background: #00f5d4;"></div>
          <div class="nut" style="background: #ff477e;"></div>
        </div>
        <div class="bolt" id="b3" onclick="handleBoltClick(3)"></div>
      </div>
    </div>

    <!-- 8. BLOCK BLAST -->
    <div id="blocks-screen" class="screen">
      <div class="grid-8x8" id="block-grid"></div>
    </div>
  </div>

  <script>
    const backBtn = document.getElementById('back-btn');
    const appTitle = document.getElementById('app-title');
    let activeInterval = null;

    /* CELEBRATION SYSTEM */
    function triggerCelebration(msg) {
      document.getElementById('celeb-msg').textContent = msg || 'YOU WIN!';
      document.getElementById('celebration-overlay').style.display = 'flex';
    }
    function closeCelebration() {
      document.getElementById('celebration-overlay').style.display = 'none';
      openMenu();
    }

    function openMenu() {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('menu-screen').classList.add('active');
      backBtn.style.display = 'none';
      appTitle.textContent = '🎮 Offline Games';
      if (activeInterval) clearInterval(activeInterval);
    }

    function launchGame(game) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      backBtn.style.display = 'block';
      if (activeInterval) clearInterval(activeInterval);

      if (game === 'dressup') {
        document.getElementById('dressup-screen').classList.add('active');
        appTitle.textContent = '💄 Dress Up & Makeup';
      } else if (game === 'ttt') {
        document.getElementById('ttt-screen').classList.add('active');
        appTitle.textContent = '❌ Tic-Tac-Toe';
        resetTTT();
      } else if (game === 'flappy') {
        document.getElementById('flappy-screen').classList.add('active');
        appTitle.textContent = '🐤 Flappy Jump';
        startFlappy();
      } else if (game === 'colorball') {
        document.getElementById('color-screen').classList.add('active');
        appTitle.textContent = '🟡 Color Ball Switch';
        startColorBall();
      } else if (game === 'snake') {
        document.getElementById('snake-screen').classList.add('active');
        appTitle.textContent = '🐍 Snake';
        startSnake();
      } else if (game === 'predict') {
        document.getElementById('predict-screen').classList.add('active');
        appTitle.textContent = '🔮 Predictions';
      } else if (game === 'nuts') {
        document.getElementById('nuts-screen').classList.add('active');
        appTitle.textContent = '🔩 Nuts & Bolts';
      } else if (game === 'blocks') {
        document.getElementById('blocks-screen').classList.add('active');
        appTitle.textContent = '🧱 Block Blast';
        initBlockGrid();
      }
    }

    /* 1. SALON CONTROLS */
    function switchSalonTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('palette-makeup').style.display = tab === 'makeup' ? 'flex' : 'none';
      document.getElementById('palette-clothes').style.display = tab === 'clothes' ? 'flex' : 'none';
      document.getElementById('palette-hats').style.display = tab === 'hats' ? 'flex' : 'none';
    }
    function setMakeup(type, color) {
      if (type === 'lipstick') document.getElementById('layer-lipstick').style.background = color;
      if (type === 'eyeshadow') document.getElementById('layer-eyeshadow').style.background = color;
    }
    function setClothes(emoji) { document.getElementById('layer-outfit').textContent = emoji; }
    function setHat(emoji) { document.getElementById('layer-hat').textContent = emoji; }

    /* 2. TIC TAC TOE WITH CELEBRATION */
    let tttBoard = ['', '', '', '', '', '', '', '', ''];
    function resetTTT() {
      tttBoard = ['', '', '', '', '', '', '', '', ''];
      const boardEl = document.getElementById('ttt-board');
      boardEl.innerHTML = '';
      document.getElementById('ttt-status').textContent = 'Your Turn (X)';
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.className = 'ttt-cell';
        cell.onclick = () => playTTT(i);
        boardEl.appendChild(cell);
      }
    }
    function playTTT(i) {
      if (tttBoard[i] !== '') return;
      tttBoard[i] = 'X';
      updateTTTUI();
      if (checkTTTWin('X')) { triggerCelebration('YOU BEAT THE AI!'); return; }
      let emptyIndices = tttBoard.map((v, idx) => v === '' ? idx : null).filter(v => v !== null);
      if (emptyIndices.length > 0) {
        let aiMove = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        tttBoard[aiMove] = 'O';
        updateTTTUI();
        if (checkTTTWin('O')) { document.getElementById('ttt-status').textContent = '🤖 AI Wins!'; }
      }
    }
    function updateTTTUI() {
      const cells = document.querySelectorAll('.ttt-cell');
      cells.forEach((cell, i) => cell.textContent = tttBoard[i]);
    }
    function checkTTTWin(p) {
      const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      return wins.some(w => w.every(idx => tttBoard[idx] === p));
    }

    /* 3. FIXED FLAPPY JUMP */
    function startFlappy() {
      const cvs = document.getElementById('flappyCanvas');
      const ctx = cvs.getContext('2d');
      let birdY = 150, velocity = 0, pipes = [], score = 0;
      cvs.onclick = () => velocity = -5.5;

      activeInterval = setInterval(() => {
        velocity += 0.35; birdY += velocity;
        if (Math.random() < 0.025) pipes.push({ x: 280, top: Math.random() * 120 + 30 });
        
        ctx.fillStyle = '#70c5ce'; ctx.fillRect(0, 0, 280, 320);
        
        // Bird
        ctx.fillStyle = '#ffb703'; ctx.beginPath(); ctx.arc(50, birdY, 10, 0, Math.PI*2); ctx.fill();

        // Check boundaries
        if (birdY > 310 || birdY < 0) { clearInterval(activeInterval); alert('Game Over!'); startFlappy(); }

        ctx.fillStyle = '#38b000';
        pipes.forEach((p, idx) => {
          p.x -= 2;
          ctx.fillRect(p.x, 0, 32, p.top);
          ctx.fillRect(p.x, p.top + 95, 32, 320);
          
          if (p.x < -32) {
            pipes.splice(idx, 1);
            score++;
            if (score >= 5) { clearInterval(activeInterval); triggerCelebration('FLAPPY MASTER!'); }
          }
          if (50 > p.x && 50 < p.x + 32 && (birdY - 10 < p.top || birdY + 10 > p.top + 95)) {
            clearInterval(activeInterval); alert('Game Over!'); startFlappy();
          }
        });
      }, 20);
    }

    /* 4. COLOR BALL SWITCH */
    function startColorBall() {
      const cvs = document.getElementById('colorCanvas');
      const ctx = cvs.getContext('2d');
      const colors = ['#ff007f', '#00f5d4'];
      let ballColor = 0, drops = [], score = 0;
      cvs.onclick = () => ballColor = (ballColor + 1) % 2;
      activeInterval = setInterval(() => {
        if (Math.random() < 0.04) drops.push({ y: 0, color: Math.floor(Math.random() * 2) });
        ctx.fillStyle = '#111'; ctx.fillRect(0, 0, 280, 320);
        ctx.fillStyle = colors[ballColor]; ctx.beginPath(); ctx.arc(140, 260, 20, 0, Math.PI*2); ctx.fill();
        drops.forEach((d, idx) => {
          d.y += 3;
          ctx.fillStyle = colors[d.color]; ctx.beginPath(); ctx.arc(140, d.y, 12, 0, Math.PI*2); ctx.fill();
          if (d.y > 240 && d.y < 280) {
            if (d.color === ballColor) {
              score++; drops.splice(idx, 1);
              if (score >= 10) { clearInterval(activeInterval); triggerCelebration('COLOR MATCH CHAMP!'); }
            } else { clearInterval(activeInterval); alert('Wrong Color!'); startColorBall(); }
          }
        });
      }, 20);
    }

    /* 5. FIXED SNAKE ENGINE WITH ARROW BUTTONS */
    let snakeDx = 1, snakeDy = 0;
    function setSnakeDir(x, y) {
      if ((x !== 0 && snakeDx === -x) || (y !== 0 && snakeDy === -y)) return;
      snakeDx = x; snakeDy = y;
    }
    function startSnake() {
      const canvas = document.getElementById('snakeCanvas');
      const ctx = canvas.getContext('2d');
      let snake = [{x: 7, y: 6}], food = {x: 3, y: 3}, score = 0;
      snakeDx = 1; snakeDy = 0;

      activeInterval = setInterval(() => {
        const head = {x: snake[0].x + snakeDx, y: snake[0].y + snakeDy};
        
        // Wall Hit Check
        if (head.x < 0 || head.x >= 14 || head.y < 0 || head.y >= 12) {
          clearInterval(activeInterval); alert('Snake Hit Wall!'); startSnake(); return;
        }

        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          score++;
          if (score >= 5) { clearInterval(activeInterval); triggerCelebration('SNAKE MASTER!'); return; }
          food = {x: Math.floor(Math.random()*12), y: Math.floor(Math.random()*10)};
        } else snake.pop();

        ctx.fillStyle = 'black'; ctx.fillRect(0, 0, 280, 240);
        ctx.fillStyle = '#00f5d4'; snake.forEach(p => ctx.fillRect(p.x*20, p.y*20, 18, 18));
        ctx.fillStyle = '#ff007f'; ctx.fillRect(food.x*20, food.y*20, 18, 18);
      }, 180);
    }

    /* PREDICTION, NUTS & BLOCKS */
    const predictions = ["✨ 100 years of good luck!", "🍕 Pizza night today!", "👑 You are secretly royal!", "🐶 A puppy will smile at you!"];
    function spinPrediction() {
      const box = document.getElementById('prediction-text');
      box.textContent = "Spinning...";
      setTimeout(() => { box.textContent = predictions[Math.floor(Math.random() * predictions.length)]; triggerCelebration('LUCKY DAY!'); }, 800);
    }

    let selectedBolt = null;
    function handleBoltClick(id) {
      const bolt = document.getElementById(`b${id}`);
      if (!selectedBolt) {
        if (bolt.children.length > 0) { selectedBolt = bolt; bolt.classList.add('selected'); }
      } else {
        if (selectedBolt !== bolt && bolt.children.length < 3) { bolt.appendChild(selectedBolt.lastElementChild); checkNutsWin(); }
        selectedBolt.classList.remove('selected'); selectedBolt = null;
      }
    }
    function checkNutsWin() {
      const b1 = document.getElementById('b1').children;
      const b2 = document.getElementById('b2').children;
      if ((b1.length === 2 && b1[0].style.background === b1[1].style.background) || (b2.length === 2 && b2[0].style.background === b2[1].style.background)) {
        triggerCelebration('PUZZLE SOLVED!');
      }
    }

    function initBlockGrid() {
      const grid = document.getElementById('block-grid');
      grid.innerHTML = '';
      for (let i = 0; i < 64; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.onclick = () => cell.classList.toggle('filled');
        grid.appendChild(cell);
      }
    }
  </script>
</body>
</html>
